[workspace]
resolver = "3"
members = ["crates/engine", "crates/viewer", "crates/lab"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "UNLICENSED"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = 1

# Integration tests play whole matches; optimise them.
[profile.test]
opt-level = 2
